$kind: http-example
request:
  url: "{{baseUrl}}/api/v1/municipios/:nome"
  method: GET
  headers:
    Accept: application/json
  pathVariables:
    nome: municipio-inexistente
response:
  statusCode: 404
  statusText: Not Found
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "detail": "Município não encontrado"
      }
order: 2000
